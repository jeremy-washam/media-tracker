name: Reviewed migration release

on:
  workflow_dispatch:
    inputs:
      migration_digest:
        description: SHA-256 migration inventory digest from release.py plan
        required: true
      recovery_reviewed:
        description: Recovery point and quiesced-writer procedure have been reviewed
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.recovery_reviewed
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-migrations
    concurrency:
      group: imladris-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:production
      - name: Migrate and deploy the same validated revision
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_CONFIGURATION: ${{ secrets.PRODUCTION_CONFIGURATION }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          MIGRATION_DIGEST: ${{ inputs.migration_digest }}
          WRANGLER_SEND_METRICS: false
        run: python3 scripts/deployment/release.py deploy --revision "$GITHUB_SHA" --migration-digest "$MIGRATION_DIGEST"
