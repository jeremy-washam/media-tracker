    #imladris-type-study .im-inspector {
      margin-top: 0;
    }
    #imladris-type-study .im-workspace:has(.im-inspector) > .im-workspace-head {
      width: 100%;
    }
  }
  @media (max-width: 920px) {
    #imladris-type-study .im-crumb {
      display: none;
    }
  }
  @media (max-width: 660px) {
    #imladris-type-study .im-app {
      min-height: 1920px;
    }
  }
  @media (max-width: 660px) {
    #imladris-type-study .im-library {
      align-content: start;
    }
  }
</style>
<script>
  ;(() => {
    const root = document.getElementById('imladris-type-study')
    const profiles = {
      compact: { name: 'Compact', sizes: [12, 14, 16, 20], weights: '400 / 500' },
      balanced: { name: 'Balanced', sizes: [12, 14, 16, 22], weights: '400 / 500 / 600' },
      readable: { name: 'Readable', sizes: [13, 15, 18, 24], weights: '400 / 500' },
    }
    const books = [
      {
        title: 'The Unbearable Lightness of Being',
        author: 'Milan Kundera',
        year: '1984',
        date: 'Oct 24, 2026',
        stars: '★★★★',
        description:
          'A novel of love, chance, and the weight of a life, set against the upheaval of twentieth-century Prague.',
      },
      {
        title: 'The Manager’s Path',
        author: 'Camille Fournier',
        year: '2017',
        date: 'Oct 18, 2026',
        stars: '★★★★',
        description:
          'A guide to engineering leadership, from mentoring individual contributors to leading teams and organizations.',
      },
      {
        title: 'Stoner',
        author: 'John Williams',
        year: '1965',
        date: 'Oct 12, 2026',
        stars: '★★★★★',
        description:
          'The quiet life of William Stoner, a teacher whose devotion to literature shapes his work and relationships.',
      },
      {
        title: 'Emergent Tokyo',
        author: 'Jorge Almazán',
        year: '2022',
        date: 'Oct 8, 2026',
        stars: '★★★★',
        description:
          'An exploration of the small-scale urban patterns and everyday places that give Tokyo its character.',
      },
      {
        title: 'The Wide Wide Sea',
        author: 'Hampton Sides',
        year: '2024',
        date: 'Sep 28, 2026',
        stars: '★★★★',
        description:
          'An account of James Cook’s final voyage and the encounters that changed the Pacific.',
      },
      {
        title: 'Interpreter of Maladies',
        author: 'Jhumpa Lahiri',
        year: '1999',
        date: 'Sep 21, 2026',
        stars: '★★★★★',
        description:
          'Stories about families, distance, belonging, and the ordinary misunderstandings between people.',
      },
    ]
    const articles = [
      {
        title: 'Good systems make room for judgment',
        author: 'Maggie Appleton · maggieappleton.com',
        year: '2026',
        date: 'Oct 25, 2026',
        description:
          'Why the most useful tools leave space for interpretation, context, and human decisions.',
      },
      {
        title: 'The streets that make a neighborhood',
        author: 'Strong Towns · strongtowns.org',
        year: '2026',
        date: 'Oct 22, 2026',
        description:
          'A close look at the small patterns that make everyday places walkable and welcoming.',
      },
      {
        title: 'Reading in an age of abundance',
        author: 'The Paris Review · theparisreview.org',
        year: '2026',
        date: 'Oct 16, 2026',
        description:
          'On choosing a book, following a curiosity, and leaving enough time to pay attention.',
      },
      {
        title: 'Designing for the long view',
        author: 'Works in Progress · worksinprogress.co',
        year: '2026',
        date: 'Oct 11, 2026',
        description:
          'What durable infrastructure can teach us about maintaining the systems we depend on.',
      },
      {
        title: 'A library is a collection of decisions',
        author: 'Anne Helen Petersen · Substack',
        year: '2026',
        date: 'Oct 6, 2026',
        description:
          'How our collections change as our interests, commitments, and circumstances evolve.',
      },
      {
        title: 'The value of a quiet interface',
        author: 'Craig Mod · craigmod.com',
        year: '2026',
        date: 'Sep 30, 2026',
        description:
          'Notes on tools that recede into the background and allow their content to come forward.',
      },
    ]
    const defaults = {
      view: 'Books',
      layout: 'List',
      theme: 'System',
      inspector: true,
      selected: 0,
      history: false,
      query: '',
      section: 'Archive',
      filters: false,
    }
    let saved = window.openai?.widgetState
    let state = { ...defaults, ...(saved?.privateContent || {}) }
    if (!['Books', 'Articles', 'Connections'].includes(state.view)) state.view = 'Books'
    function icon(name) {
      return `<i data-lucide="${name}" aria-hidden="true"></i>`
    }
    function cover(i) {
      return `<span class="im-cover" data-art="${i % 6}" aria-hidden="true"></span>`
    }
    function persist() {
      window.openai
        ?.setWidgetState({
          modelContent: {
            typographyView: state.view,
            layout: state.layout,
            appearance: state.theme,
          },
          privateContent: state,
        })
        ?.catch(() => {})
    }
    function nav(label, name, disabled = false) {
      return `<button type="button" class="cursor-interaction ${state.view === label ? 'is-current' : ''} ${disabled ? 'im-disabled' : ''}" ${disabled ? 'disabled' : `data-view="${label}"`}>${icon(name)}<span>${label}</span>${disabled ? '<span class="im-later">Later</span>' : ''}</button>`
    }
    function inspector() {
      const item = (state.view === 'Articles' ? articles : books)[
        Math.max(0, Math.min(5, state.selected))
      ]
      return `<aside class="im-inspector" aria-label="${item.title} inspector"><div class="im-inspector-tabs"><button type="button" class="cursor-interaction" data-history="false" aria-pressed="${!state.history}">Details</button><button type="button" class="cursor-interaction" data-history="true" aria-pressed="${state.history}">History</button><button class="im-close cursor-interaction" type="button" data-close aria-label="Close inspector">${icon('x')}</button></div><div class="im-detail">${state.history ? `<h2>${item.title}</h2><ol class="im-history"><li><span>Finished reading</span><span class="im-meta">${item.date}</span></li><li><span>${state.view === 'Articles' ? 'Saved to Reader' : 'Added to Hardcover'}</span><span class="im-meta">Sep 12, 2026</span></li><li><span>Imported into Imladris</span><span class="im-meta">Oct 26, 2026</span></li></ol>` : `<div class="im-detail-top">${cover(state.selected)}<div><h2>${item.title}</h2><p>${item.author}</p><span class="im-meta">${item.year}</span></div></div><div class="im-rating">${item.stars || ''}</div><h3>Overview</h3><p>${item.description}</p><h3>${state.view === 'Articles' ? 'Reading' : 'Your reading'}</h3><dl><dt>Status</dt><dd>Read</dd><dt>Finished</dt><dd>${item.date}</dd>${state.view === 'Books' ? '<dt>Your rating</dt><dd>' + item.stars.length + ' / 5</dd>' : ''}</dl><h3>Details</h3><dl><dt>${state.view === 'Articles' ? 'Publisher' : 'Author'}</dt><dd>${item.author.split(' · ')[0]}</dd><dt>${state.view === 'Articles' ? 'Published' : 'First published'}</dt><dd>${item.year}</dd>${state.view === 'Books' ? '<dt>Pages</dt><dd>320</dd><dt>Language</dt><dd>English</dd>' : '<dt>Length</dt><dd>8 min read</dd>'}</dl><h3>Source</h3><p>${state.view === 'Articles' ? 'Readwise Reader' : 'Hardcover'}</p><button type="button" class="im-detail-link cursor-interaction" data-history="true">View source history ${icon('arrow-up-right')}</button>`}</div></aside>`
    }
    function collection() {
      const isArticle = state.view === 'Articles'
      const items = isArticle ? articles : books
      const filtered = items
        .map((b, i) => ({ ...b, i }))
        .filter((b) => (b.title + ' ' + b.author).toLowerCase().includes(state.query.toLowerCase()))
      return `<main class="im-collection ${isArticle ? 'im-article' : ''}"><div class="im-toolbar"><label class="im-search">${icon('search')}<input aria-label="Search ${state.view.toLowerCase()}" placeholder="Search ${state.view.toLowerCase()}" value="${state.query.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}"></label><button class="im-control cursor-interaction" type="button" data-filters aria-expanded="${state.filters}">${icon('sliders-horizontal')}Filters</button><select aria-label="Sort ${state.view.toLowerCase()}"><option>Read date</option><option>Title</option><option>Publish year</option></select><button class="im-control cursor-interaction" type="button" data-sort-dir aria-label="Reverse sort">${icon('arrow-down-wide-narrow')}</button>${!isArticle ? `<div class="im-toggle"><button class="im-control cursor-interaction" type="button" data-layout="List" aria-label="List view" aria-pressed="${state.layout === 'List'}">${icon('list')}</button><button class="im-control cursor-interaction" type="button" data-layout="Grid" aria-label="Grid view" aria-pressed="${state.layout === 'Grid'}">${icon('layout-grid')}</button></div>` : ''}</div>${state.filters ? '<div class="im-filter-panel"><span class="im-label">Rating</span><label><input type="checkbox"> 5 stars</label><label><input type="checkbox"> 4 stars</label><button type="button" class="im-control cursor-interaction" data-filters>Done</button></div>' : ''}<div class="im-summary">${state.query ? filtered.length : isArticle ? '212' : '128'} ${state.view.toLowerCase()} · ${state.section}</div><div class="im-results ${!isArticle && state.layout === 'Grid' ? 'im-grid' : ''}">${filtered.map((b) => `<button type="button" class="im-row cursor-interaction ${state.inspector && b.i === state.selected ? 'is-selected' : ''}" data-select="${b.i}" aria-label="Inspect ${b.title}" aria-pressed="${state.inspector && b.i === state.selected}">${cover(b.i)}<span class="im-row-copy"><span class="im-title">${b.title}</span><span class="im-subtitle">${b.author}</span><span class="im-meta">${isArticle ? '8 min read · ' : b.year + ' · '}${b.date}</span></span>${!isArticle ? `<span class="im-rating" aria-label="${b.stars.length} out of 5 stars">${b.stars}</span>` : ''}</button>`).join('') || '<div class="im-summary">No matching items</div>'}</div></main>`
    }
    function connections() {
      return `<main class="im-connections im-connection-list">${[
        ['Hardcover', 'H', '128 books · Last synced 2 hours ago'],
        ['Letterboxd', 'L', '1,206 films · Last synced 3 hours ago'],
        ['Readwise Reader', 'R', '212 articles · Last synced 34 minutes ago'],
        ['Spotify', 'S', '624 albums · Last synced 1 hour ago'],
        ['YouTube', 'Y', '417 videos · Last imported Oct 24, 2026'],
      ]
        .map(
          (s) =>
            `<section class="im-source"><span class="im-source-mark" aria-hidden="true">${s[1]}</span><div><h2 class="im-title">${s[0]}</h2><div class="im-subtitle">${s[2]}</div><div class="im-status"><span class="im-dot"></span>Connected</div></div><div class="im-source-actions"><button type="button" class="im-control cursor-interaction" data-sync>${icon('refresh-cw')}Sync</button><button type="button" class="im-control cursor-interaction" data-source-details>Details ${icon('chevron-down')}</button></div></section>`,
        )
        .join('')}</main>`
    }
    function render() {
      root.querySelectorAll('.im-study').forEach((el) => {
        const p = profiles[el.dataset.profile]
        el.dataset.theme = state.theme.toLowerCase()
        el.innerHTML = `<div class="im-app"><aside class="im-sidebar" aria-label="Navigation"><div class="im-brand">${icon('mountain-snow')}Imladris<button type="button" class="cursor-interaction" data-collapse aria-label="Collapse sidebar">${icon('panel-left-close')}</button></div><nav class="im-nav">${nav('Chat', 'message-square', true)}${nav('Library', 'library-big')}${nav('Recaps', 'chart-no-axes-combined', true)}<div class="im-label im-nav-label">Media</div>${nav('Books', 'book-open')}${nav('Movies', 'clapperboard')}${nav('Articles', 'newspaper')}${nav('Podcasts', 'mic')}${nav('Music', 'music-2')}${nav('Videos', 'video')}</nav><div class="im-foot">${nav('Connections', 'plug')}<button type="button" class="cursor-interaction" data-theme>${icon('sun-moon')}Appearance</button><div class="im-health"><span class="im-dot"></span>Local API connected</div></div></aside><section class="im-workspace"><header class="im-workspace-head"><span class="im-mobile-nav"><select aria-label="Navigate"><option ${state.view === 'Books' ? 'selected' : ''}>Books</option><option ${state.view === 'Articles' ? 'selected' : ''}>Articles</option><option ${state.view === 'Connections' ? 'selected' : ''}>Connections</option></select></span><div class="im-crumb">${state.view === 'Connections' ? '<strong>Connections</strong>' : 'Library <span>/</span><strong>' + state.view + '</strong>'}</div>${state.view !== 'Connections' ? `<div class="im-sections"><button type="button" class="cursor-interaction" data-section="Archive" aria-pressed="${state.section === 'Archive'}">Archive <span class="im-count">${state.view === 'Books' ? '128' : '212'}</span></button><button type="button" class="cursor-interaction" data-section="Queue" aria-pressed="${state.section === 'Queue'}">Queue <span class="im-count">986</span></button></div>` : ''}</header><div class="im-library" style="${!state.inspector || state.view === 'Connections' ? 'grid-template-columns:minmax(0,1fr)' : ''}">${state.view === 'Connections' ? connections() : collection() + (state.inspector ? inspector() : '')}</div></section></div><div class="im-role-key" aria-label="${p.name} type roles"><div><strong>${p.sizes[0]} px · 400</strong>Metadata, counts, inspector body</div><div><strong>${p.sizes[1]} px · ${p.weights}</strong>Navigation, controls, headings, grid titles</div><div><strong>${p.sizes[2]} px · ${el.dataset.profile === 'balanced' ? '600' : '500'}</strong>List titles</div><div><strong>${p.sizes[3]} px · 500</strong>Inspector title, wordmark</div></div>`
      })
      if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } })
    }
    root.addEventListener('click', (event) => {
      const b = event.target.closest('button')
      if (!b) return
      if (b.dataset.view) {
        state.view = ['Articles', 'Connections'].includes(b.dataset.view) ? b.dataset.view : 'Books'
        state.query = ''
        state.selected = 0
        state.inspector = true
      } else if (b.dataset.select !== undefined) {
        const i = Number(b.dataset.select)
        state.inspector = i === state.selected ? !state.inspector : true
        state.selected = i
      } else if (b.dataset.layout) {
        state.layout = b.dataset.layout
      } else if (b.dataset.history) {
        state.history = b.dataset.history === 'true'
      } else if (b.hasAttribute('data-close')) state.inspector = false
      else if (b.hasAttribute('data-theme')) state.theme = state.theme === 'Dark' ? 'Light' : 'Dark'
      else if (b.hasAttribute('data-filters')) state.filters = !state.filters
      else if (b.dataset.section) state.section = b.dataset.section
      else if (b.hasAttribute('data-collapse')) {
        const side = b.closest('.im-sidebar')
        side.style.display = 'none'
        side.parentElement.style.gridTemplateColumns = 'minmax(0,1fr)'
        return
      } else if (b.hasAttribute('data-sync')) {
        b.textContent = 'Up to date'
        return
      } else if (b.hasAttribute('data-source-details')) {
        const source = b.closest('.im-source')
        const existing = source.querySelector('.im-source-extra')
        if (existing) existing.remove()
        else {
          const d = document.createElement('div')
          d.className = 'im-subtitle im-source-extra'
          d.textContent = 'Latest sync completed · Imported records retain their source history.'
          source.querySelector('h2').parentElement.append(d)
        }
        return
      } else return
      render()
      persist()
    })
    root.addEventListener('input', (event) => {
      if (!event.target.matches('.im-search input')) return
      const pos = event.target.selectionStart
      state.query = event.target.value
      const profile = event.target.closest('.im-study').dataset.profile
      render()
      const input = root.querySelector(`[data-profile="${profile}"] .im-search input`)
      input.focus()
      input.setSelectionRange(pos, pos)
      persist()
    })
    root.addEventListener('change', (event) => {
      if (event.target.matches('.im-mobile-nav select')) {
        state.view = event.target.value
        state.query = ''
        state.selected = 0
        render()
        persist()
      }
    })
    window.addEventListener('openai:set_globals', (event) => {
      const incoming = event.detail?.globals?.widgetState?.privateContent
      if (incoming) {
        state = { ...defaults, ...incoming }
        render()
      }
    })
    render()
    if (globalThis.Tweak) {
      const tweak = new Tweak({
        container: root,
        onChange: () => {
          render()
          persist()
        },
      })
      tweak.addSelect(state, 'view', {
        label: 'Example surface',
        options: ['Books', 'Articles', 'Connections'],
      })
      tweak.addSelect(state, 'layout', { label: 'Books layout', options: ['List', 'Grid'] })
      tweak.addSelect(state, 'theme', { label: 'Appearance', options: ['System', 'Light', 'Dark'] })
      tweak.addToggle(state, 'inspector', { label: 'Inspector' })
    }
  })()
</script>
